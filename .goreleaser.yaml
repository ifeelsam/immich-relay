version: 2
project_name: immich-relay

before:
  hooks:
    - go mod tidy

builds:
  - id: immich-relay
    main: ./cmd/immich-relay
    binary: immich-relay
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [immich-relay]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.yaml

nfpms:
  - id: linux-packages
    ids: [immich-relay]
    package_name: immich-relay
    vendor: Immich Relay contributors
    homepage: https://github.com/ifeelsam/immich-relay
    maintainer: Immich Relay contributors
    description: Safely relay Immich originals to Android over ADB.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/immich-relay.service
        dst: /usr/lib/systemd/user/immich-relay.service
      - src: config.example.yaml
        dst: /usr/share/doc/immich-relay/config.example.yaml
    dependencies:
      - adb
    overrides:
      rpm:
        dependencies:
          - android-tools

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
